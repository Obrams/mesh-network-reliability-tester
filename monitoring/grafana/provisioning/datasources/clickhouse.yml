apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-mesh
    access: proxy
    url: http://clickhouse:8123
    isDefault: true
    editable: false
    jsonData:
      defaultDatabase: mesh_network
      port: 9000
      server: clickhouse
      username: default
      tlsSkipVerify: true
    secureJsonData:
      password: ""

